# Cesspool Pruned: the static site tools/update.py renders, on port 8080.
#
# Adapted from deploy/cesspool.lol.nginx. That file is a public site's: TLS, Cloudflare's client
# certificate and addresses, HSTS and a rate limit on /api/. Here another program in front of this
# one (StartOS, Umbrel's app proxy) does TLS and decides who gets in, so those are gone. What the
# site itself needs is kept: the rewrite for /tx/<txid>, /d/ served from .json.gz files, a JSON 404
# under /api/, and the Content-Security-Policy.
#
# It runs as whatever user it is started as, root or not, and writes nothing but its pid and
# temporary files under /tmp. It keeps no access log.
worker_processes 2;
pid /tmp/cesspool-nginx.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/cesspool-nginx-body;
    proxy_temp_path /tmp/cesspool-nginx-proxy;
    fastcgi_temp_path /tmp/cesspool-nginx-fastcgi;
    uwsgi_temp_path /tmp/cesspool-nginx-uwsgi;
    scgi_temp_path /tmp/cesspool-nginx-scgi;

    # The API under /api/: a cache header by status, so a 404 for a height not graded yet is not kept.
    map $status $cesspool_api_cache {
        200 "public, max-age=60";
        206 "public, max-age=60";
        304 "public, max-age=60";
        default "no-store";
    }

    server {
        listen 8080;
        # /data/www/current is a link to the site of the chain being graded now (tools/serve.py).
        root /data/www/current;
        index index.html;
        error_page 404 /404.html;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Static pages, no inline scripts. Inline styles carry bar widths. The pages fetch their
        # data from /d/ on this origin, and nothing from anywhere else.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        # /tx/<txid> is the transaction page; site.js reads the txid from the path. The Lightning
        # node and channel pages work the same way (cesspool/lightning.py, static/lightning.js).
        rewrite "^/tx/[0-9a-fA-F]{64}/?$" /tx/index.html last;
        rewrite "^/lightning/node/[0-9a-fA-F]{66}/?$" /lightning/node/index.html last;
        rewrite "^/lightning/channel/[0-9]+(x[0-9]+x[0-9]+)?/?$" /lightning/channel/index.html last;

        # The settings form's endpoint, written by docker/web.sh only where the form is on. A glob,
        # so that nginx starts without it everywhere else.
        include /tmp/cesspool-nginx-settings*.conf;

        # Where the updater stands: the health check reads it, and so does the starting page.
        location = /status.json {
            alias /data/status.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'" always;
        }
        # The page shown until the first build is there, and its script.
        location /starting/ {
            alias /app/docker/starting/;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        }
        location /static/ {
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'" always;
        }
        # The three IBM Plex files. Debian's mime.types has no entry for .ttf, and nosniff is on.
        location /static/fonts/ {
            types { font/ttf ttf; }
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'" always;
        }
        # Transaction data for /tx/ and the other indexes, stored only as .json.gz and served as JSON.
        location /d/ {
            gzip_static always;
            gunzip on;
            default_type application/json;
            add_header Cache-Control "public, max-age=60" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'" always;
        }
        # The read-only API (cesspool/api.py).
        location /api/ {
            default_type application/json;
            add_header Cache-Control $cesspool_api_cache always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'" always;
            try_files $uri @api404;
        }
        # A height not graded here: a JSON 404, not the HTML page.
        location @api404 {
            types { }
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'" always;
            return 404 '{"error":"not found"}\n';
        }
        location /og/ {
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location / {
            # tip.json is the last file a build writes. Without it there is no site yet.
            if (!-f /data/www/current/tip.json) {
                rewrite ^ /starting/index.html last;
            }
            add_header Cache-Control "public, max-age=60" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
            try_files $uri $uri/ =404;
        }
        location ~ /\. { return 404; }
    }
}
